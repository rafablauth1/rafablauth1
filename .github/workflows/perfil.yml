name: Atualizar perfil

# Redesenha o espectro de atividade, confere quais projetos estão públicos (link no card) e gera a cobrinha.
# Roda a cada envio, todo dia às 06:00 de Brasília e pelo botão "Run workflow" na aba Actions.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: perfil
  cancel-in-progress: false

jobs:
  perfil:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Cards, README e espectro de atividade
        run: |
          python3 scripts/estaticos.py
          python3 scripts/atividade.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USUARIO: ${{ github.repository_owner }}
      - name: Gravar se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets
          if git commit -m "Atualiza o perfil"; then git push; fi

  cobrinha:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/cobrinha-claro.svg?color_snake=#E6B73C&color_dots=#ebedf0,#b8ece6,#7ddcd2,#4fd1c5,#2a9d94
            dist/cobrinha-escuro.svg?color_snake=#E6B73C&color_dots=#161b22,#103b3a,#17605b,#2a9d94,#4fd1c5
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
